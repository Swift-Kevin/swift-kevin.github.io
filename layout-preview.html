<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Layout Preview — Kevin W.</title>
    <link rel="icon" type="image/png" href="SiteImages/tabicon.png" />
    <style>
        @font-face {
            font-family: "Custom-Consolas";
            src: url('SiteFonts/Consolas.ttf');
            font-display: swap;
        }

        *, *::before, *::after { box-sizing: border-box; }

        :root {
            --mono: "Custom-Consolas", Consolas, ui-monospace, monospace;
            --bg: #0f0f10;
            --surface: #17171a;
            --surface2: #1f1f23;
            --line: #2c2c31;
            --text: #f5f5f4;
            --muted: #a2a2ab;
            --accent: #e67e22;
            --accent2: #f0a55e;
            --radius: 0.1875rem;
            --border-w: 0.0625rem;
            --divider-w: 0.125rem;
            --pad: 5%;
            --gap: clamp(1.6rem, 3.5vw, 3rem);
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: var(--mono);
            line-height: 1.65;
            padding-bottom: 7rem;
        }

        a { color: var(--accent2); text-decoration: underline; text-underline-offset: 0.2em; }
        a:hover { color: var(--accent); }
        h1, h2, h3, h4 { margin: 0; letter-spacing: -0.01em; }

        .stage { max-width: 100%; margin: 0 auto; transition: max-width 0.2s; }
        .stage[data-view="mobile"] { max-width: 26rem; border-inline: var(--border-w) dashed var(--line); }

        header.site {
            position: sticky; top: 0; z-index: 40;
            background: var(--surface);
            border-bottom: var(--border-w) solid var(--line);
            display: flex; align-items: center; gap: 0.4rem;
            flex-wrap: nowrap;
            padding: 0.85rem var(--pad);
        }

        .brand { font-size: clamp(1rem, 2.2vw, 1.5rem); font-weight: 700; color: var(--text); text-decoration: none; margin-right: auto; white-space: nowrap; }
        .navlinks { display: flex; gap: 0.35rem; flex-wrap: nowrap; }
        .navlinks a {
            font-size: 0.85rem; color: var(--muted); text-decoration: none;
            padding: 0.45rem 0.7rem; border: var(--border-w) solid transparent;
            border-radius: var(--radius) var(--radius) 0 0;
        }
        .navlinks a:hover { color: var(--text); background: var(--surface2); border-color: var(--line); border-bottom-color: var(--accent); }

        .wrap { padding-inline: var(--pad); }
        .sectionhead { margin: var(--gap) 0 1.4rem; }
        .sectionhead h2 { font-size: clamp(1.3rem, 2.6vw, 2rem); }
        .sectionhead p { color: var(--muted); font-size: 0.85rem; margin: 0.3rem 0 0; }

        hr.rule { width: 60%; height: 0; margin: var(--gap) auto; border: 0; border-top: var(--divider-w) solid var(--line); }

        .hero { padding: var(--gap) 0; }
        .eyebrow { font-size: 0.78rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); }
        .hero h1 { font-size: clamp(1.8rem, 3.6vw, 3rem); margin: 0.8rem 0 1rem; }
        .hero p { color: var(--muted); margin: 0; }

        .ph {
            background:
                linear-gradient(135deg, var(--surface2) 25%, transparent 25%) -12px 0/24px 24px,
                linear-gradient(225deg, var(--surface2) 25%, transparent 25%) -12px 0/24px 24px,
                var(--surface);
            border: var(--border-w) solid var(--line);
            border-radius: var(--radius);
            display: grid; place-items: center;
            font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted);
            aspect-ratio: 16 / 9;
            width: 100%;
        }

        .tags { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.6rem; }
        .tag {
            font-size: 0.68rem; letter-spacing: 0.06em; text-transform: uppercase;
            color: var(--accent); background: var(--surface2);
            border: var(--border-w) solid var(--line); border-radius: var(--radius);
            padding: 0.15rem 0.5rem;
        }
        .blurb { color: var(--muted); font-size: 0.92rem; margin: 0.5rem 0 0; }
        .ptitle { font-size: 1.3rem; }
        .go { display: inline-block; margin-top: 0.8rem; font-size: 0.85rem; }

        /* 01 alternating */
        [data-layout="alternating"] .row { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(1.5rem, 4vw, 3rem); align-items: center; margin-bottom: var(--gap); }
        [data-layout="alternating"] .row:nth-child(even) .rowtext { order: 2; }

        /* 02 card grid */
        [data-layout="cards"] .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(19rem, 1fr)); gap: 1.4rem; }
        [data-layout="cards"] .card { background: var(--surface); border: var(--border-w) solid var(--line); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; transition: transform 0.18s, border-color 0.18s; }
        [data-layout="cards"] .card:hover { transform: translateY(-0.25rem); border-color: var(--accent); }
        [data-layout="cards"] .card .ph { border: 0; border-bottom: var(--border-w) solid var(--line); border-radius: 0; }
        [data-layout="cards"] .cbody { padding: 1.1rem 1.2rem 1.4rem; display: flex; flex-direction: column; flex: 1; }

        /* 03 mosaic */
        [data-layout="mosaic"] .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(17rem, 1fr)); gap: 1.2rem; align-items: start; }
        [data-layout="mosaic"] .card { background: var(--surface); border: var(--border-w) solid var(--line); border-radius: var(--radius); overflow: hidden; }
        [data-layout="mosaic"] .card:nth-child(3n+2) { margin-top: 2.5rem; }
        [data-layout="mosaic"] .card:nth-child(3n) { margin-top: 1.2rem; }
        [data-layout="mosaic"] .card:nth-child(4n+1) .ph { aspect-ratio: 4 / 5; }
        [data-layout="mosaic"] .card:nth-child(3n+2) .ph { aspect-ratio: 1 / 1; }
        [data-layout="mosaic"] .card .ph { border: 0; border-bottom: var(--border-w) solid var(--line); border-radius: 0; }
        [data-layout="mosaic"] .cbody { padding: 1rem 1.1rem 1.3rem; }

        /* 04 feature rows */
        [data-layout="feature"] .feat { position: relative; margin-bottom: 1.2rem; border: var(--border-w) solid var(--line); border-radius: var(--radius); overflow: hidden; }
        [data-layout="feature"] .feat .ph { aspect-ratio: 21 / 9; border: 0; border-radius: 0; }
        [data-layout="feature"] .overlay { position: absolute; inset: auto 0 0 0; padding: clamp(1rem, 3vw, 2rem); background: linear-gradient(to top, rgba(15,15,16,0.96) 25%, rgba(15,15,16,0)); }
        [data-layout="feature"] .overlay .blurb { max-width: 46rem; }

        /* 05 sticky index */
        [data-layout="index"] .split { display: grid; grid-template-columns: 15rem 1fr; gap: clamp(1.5rem, 4vw, 3rem); align-items: start; }
        [data-layout="index"] .idx { position: sticky; top: 5.5rem; display: flex; flex-direction: column; gap: 0.2rem; border-left: var(--divider-w) solid var(--line); }
        [data-layout="index"] .idx a { text-decoration: none; color: var(--muted); font-size: 0.88rem; padding: 0.4rem 0.8rem; border-left: var(--divider-w) solid transparent; margin-left: calc(var(--divider-w) * -1); }
        [data-layout="index"] .idx a:hover { color: var(--text); border-left-color: var(--accent); }
        [data-layout="index"] .entry { margin-bottom: var(--gap); }
        [data-layout="index"] .entry .ph { margin-top: 0.9rem; }

        /* 06 shelf */
        [data-layout="shelf"] .shelf { display: grid; grid-auto-flow: column; grid-auto-columns: min(22rem, 78vw); gap: 1.2rem; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 1rem; }
        [data-layout="shelf"] .shelf > * { scroll-snap-align: start; }
        [data-layout="shelf"] .card { background: var(--surface); border: var(--border-w) solid var(--line); border-radius: var(--radius); overflow: hidden; }
        [data-layout="shelf"] .card .ph { border: 0; border-bottom: var(--border-w) solid var(--line); border-radius: 0; }
        [data-layout="shelf"] .cbody { padding: 1rem 1.1rem 1.3rem; }
        [data-layout="shelf"] .hint { color: var(--muted); font-size: 0.78rem; margin-top: 0.5rem; }

        /* 07 compact list */
        [data-layout="list"] .lrow { display: grid; grid-template-columns: 1fr auto; gap: 1rem; align-items: center; padding: 1rem 0; border-bottom: var(--border-w) solid var(--line); transition: background 0.15s, padding-left 0.15s; }
        [data-layout="list"] .lrow:hover { background: var(--surface); padding-left: 0.8rem; }
        [data-layout="list"] .lmeta { color: var(--muted); font-size: 0.8rem; white-space: nowrap; }
        [data-layout="list"] .lpeek { width: 7rem; }
        [data-layout="list"] .lpeek .ph { aspect-ratio: 16/9; font-size: 0; }

        /* 08 split screen */
        [data-layout="splitscreen"] .ss { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(1.5rem, 4vw, 3rem); align-items: start; }
        [data-layout="splitscreen"] .ssmedia { position: sticky; top: 5.5rem; }
        [data-layout="splitscreen"] .ssentry { margin-bottom: var(--gap); padding-bottom: var(--gap); border-bottom: var(--border-w) solid var(--line); }

        /* 09 timeline */
        [data-layout="timeline"] .tl { position: relative; padding-left: 2rem; border-left: var(--divider-w) solid var(--line); }
        [data-layout="timeline"] .tentry { position: relative; margin-bottom: var(--gap); }
        [data-layout="timeline"] .tentry::before { content: ""; position: absolute; left: calc(-2rem - 0.35rem); top: 0.55rem; width: 0.6rem; height: 0.6rem; background: var(--accent); border-radius: 50%; }
        [data-layout="timeline"] .tdate { font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }
        [data-layout="timeline"] .tgrid { display: grid; grid-template-columns: 1fr 14rem; gap: 1.2rem; align-items: start; margin-top: 0.5rem; }

        /* 11 proposed */
        [data-layout="proposed"] .featgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(19rem, 1fr)); gap: 1.4rem; }
        [data-layout="proposed"] .card { background: var(--surface); border: var(--border-w) solid var(--line); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; transition: transform 0.18s, border-color 0.18s; }
        [data-layout="proposed"] .card:hover { transform: translateY(-0.25rem); border-color: var(--accent); }
        [data-layout="proposed"] .card .ph { border: 0; border-bottom: var(--border-w) solid var(--line); border-radius: 0; }
        [data-layout="proposed"] .cbody { padding: 1.1rem 1.2rem 1.4rem; display: flex; flex-direction: column; flex: 1; }
        [data-layout="proposed"] .subhead { margin: var(--gap) 0 1.2rem; padding-top: var(--gap); border-top: var(--divider-w) solid var(--line); }
        [data-layout="proposed"] .subhead h3 { font-size: clamp(1.1rem, 2.2vw, 1.5rem); }
        [data-layout="proposed"] .subhead p { color: var(--muted); font-size: 0.82rem; margin: 0.3rem 0 0; }
        [data-layout="proposed"] .split { display: grid; grid-template-columns: 14rem 1fr; gap: clamp(1.5rem, 4vw, 3rem); align-items: start; }
        [data-layout="proposed"] .idx { position: sticky; top: 5.5rem; display: flex; flex-direction: column; gap: 0.1rem; border-left: var(--divider-w) solid var(--line); }
        [data-layout="proposed"] .idx a { text-decoration: none; color: var(--muted); font-size: 0.82rem; padding: 0.35rem 0.8rem; border-left: var(--divider-w) solid transparent; margin-left: calc(var(--divider-w) * -1); transition: color 0.15s, border-color 0.15s; }
        [data-layout="proposed"] .idx a:hover { color: var(--text); }
        [data-layout="proposed"] .idx a.active { color: var(--accent2); border-left-color: var(--accent); }
        [data-layout="proposed"] .lrow { display: grid; grid-template-columns: 1fr auto; gap: 1rem; align-items: center; padding: 1rem 0; border-bottom: var(--border-w) solid var(--line); scroll-margin-top: 6rem; transition: background 0.15s, padding-left 0.15s; }
        [data-layout="proposed"] .lrow:hover { background: var(--surface); padding-left: 0.8rem; }
        [data-layout="proposed"] .lmeta { color: var(--muted); font-size: 0.78rem; white-space: nowrap; text-align: right; }
        [data-layout="proposed"] .lpeek { width: 7rem; }
        [data-layout="proposed"] .lpeek .ph { aspect-ratio: 16/9; font-size: 0; }

        /* 10 magazine */
        [data-layout="magazine"] .mag { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.2rem; }
        [data-layout="magazine"] .card { background: var(--surface); border: var(--border-w) solid var(--line); border-radius: var(--radius); overflow: hidden; }
        [data-layout="magazine"] .card .ph { border: 0; border-bottom: var(--border-w) solid var(--line); border-radius: 0; }
        [data-layout="magazine"] .cbody { padding: 1rem 1.1rem 1.3rem; }
        [data-layout="magazine"] .card:first-child { grid-column: span 2; grid-row: span 2; }
        [data-layout="magazine"] .card:first-child .ph { aspect-ratio: 16 / 10; }
        [data-layout="magazine"] .card:first-child .ptitle { font-size: 1.7rem; }

        footer.site { border-top: var(--border-w) solid var(--line); margin-top: var(--gap); padding: var(--gap) var(--pad); text-align: center; color: var(--muted); }

        /* responsive collapse for every layout */
        @media (max-width: 860px) {
            [data-layout="alternating"] .row { grid-template-columns: 1fr; }
            [data-layout="alternating"] .row:nth-child(even) .rowtext { order: 0; }
            [data-layout="index"] .split,
            [data-layout="splitscreen"] .ss,
            [data-layout="timeline"] .tgrid { grid-template-columns: 1fr; }
            [data-layout="index"] .idx,
            [data-layout="splitscreen"] .ssmedia { position: static; }
            [data-layout="index"] .idx { flex-direction: row; flex-wrap: wrap; border-left: 0; }
            [data-layout="magazine"] .mag { grid-template-columns: 1fr; }
            [data-layout="magazine"] .card:first-child { grid-column: auto; grid-row: auto; }
            [data-layout="list"] .lrow { grid-template-columns: 1fr; }
            [data-layout="list"] .lpeek { display: none; }
            [data-layout="feature"] .feat .ph { aspect-ratio: 4 / 3; }
            [data-layout="proposed"] .split { grid-template-columns: 1fr; }
            [data-layout="proposed"] .idx { position: static; flex-direction: column; gap: 0; margin-bottom: 1.5rem; }
            [data-layout="proposed"] .idx a { padding: 0.5rem 0.8rem; border-bottom: var(--border-w) solid var(--line); }
            [data-layout="proposed"] .idx a:last-child { border-bottom: 0; }
            [data-layout="proposed"] .lrow { grid-template-columns: 1fr; }
            [data-layout="proposed"] .lpeek { display: none; }
        }

        /* switcher */
        .switch {
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 90;
            background: var(--surface); border-top: var(--border-w) solid var(--line);
            padding: 0.5rem var(--pad);
            display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;
        }
        .switch .lbl { font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-right: auto; }
        .switch button {
            font-family: var(--mono); font-size: 0.72rem; cursor: pointer;
            background: transparent; color: var(--muted);
            border: var(--border-w) solid var(--line); border-radius: var(--radius);
            padding: 0.35rem 0.55rem;
        }
        .switch button:hover { color: var(--text); background: var(--surface2); }
        .switch button[aria-pressed="true"] { background: var(--accent); color: var(--bg); font-weight: 700; border-color: var(--accent); }
        .switch .viewtoggle { border-left: var(--border-w) solid var(--line); padding-left: 0.5rem; margin-left: 0.3rem; display: flex; gap: 0.3rem; }
    </style>
</head>
<body>
    <div class="stage" id="stage" data-view="desktop">
        <header class="site">
            <a class="brand" href="#">Kevin Wall</a>
            <nav class="navlinks">
                <a href="#">Home</a><a href="#">Projects</a><a href="#">Résumé</a>
            </nav>
        </header>

        <div class="wrap">
            <section class="hero">
                <div class="eyebrow">Game Developer — Winter Park, FL</div>
                <h1>Reinventing the gaming experience, one update at a time.</h1>
                <p>Gameplay and UI programmer working in C++, C#, Unity, and Unreal Engine.</p>
            </section>
        </div>

        <hr class="rule">

        <div class="wrap">
            <div class="sectionhead">
                <h2 id="layoutName">Selected Work</h2>
                <p id="layoutDesc"></p>
            </div>
            <div id="content"></div>
        </div>

        <hr class="rule">
        <footer class="site">Connect with me</footer>
    </div>

    <div class="switch" role="group" aria-label="Layout switcher">
        <span class="lbl" id="current">01 — Alternating Rows</span>
        <div id="buttons"></div>
        <div class="viewtoggle">
            <button data-view="desktop" aria-pressed="true">Desktop</button>
            <button data-view="mobile" aria-pressed="false">Mobile</button>
        </div>
    </div>

    <script>
        const PROJECTS = [
            { name: "Untitled Space Shooter", year: "2023—24", role: "Generalist Programmer / Designer", team: 2, time: "1+ year",
              blurb: "Fight through endless waves of geometric enemies and climb the galactic leaderboard in this take on an arcade classic.",
              tags: ["Unity", "UI", "Design"] },
            { name: "Undead Paradise", year: "2024", role: "Team Lead / Generalist", team: 2, time: "2 months",
              blurb: "Survive the undead in a tropical hell. Unlock weapons and perks while upgrading your arsenal.",
              tags: ["Unity", "Object Pooling", "Steam"] },
            { name: "VR Dungeon Crawler", year: "2024", role: "UI / Networking / Generalist", team: 4, time: "4 months",
              blurb: "Four-player co-op roguelike with physics-based weapons and networked world-space UI.",
              tags: ["VR", "Networking", "Unity"] },
            { name: "Psychic Protocol", year: "2023", role: "UI/UX Generalist Programmer", team: 6, time: "2 months",
              blurb: "Escape an underground research facility across five levels of puzzle rooms and unlockable abilities.",
              tags: ["Unity", "UI/UX", "Audio"] },
            { name: "Invasion of Liberty", year: "2023", role: "Graphics Programmer / Secondary Lead", team: 4, time: "1 month",
              blurb: "A 2.5D remake of the arcade classic Defender (1981), built on a custom Vulkan rendering pipeline.",
              tags: ["C++", "Vulkan", "Graphics"] },
            { name: "Small Side Projects", year: "2022—24", role: "Solo", team: 1, time: "ongoing",
              blurb: "Game jams and tools: Cubic Quarantine, a networked racing prototype, and Conway's Game of Life.",
              tags: ["wxWidgets", "Flocking", "Jams"] },
        ];

        const FILLER = ["A", "B", "C", "D", "E", "F"].map((L, i) => ({
            name: `Project ${L}`, year: `202${3 - (i % 3)}`, role: "Generalist Programmer",
            team: (i % 4) + 1, time: `${(i % 5) + 1} months`,
            blurb: "Placeholder entry showing how the list reads once more projects are added over time.",
            tags: ["Unity", "Tools"],
        }));

        const slug = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

        const ph = (label) => `<div class="ph">${label}</div>`;
        const tags = (p) => `<div class="tags">${p.tags.map(t => `<span class="tag">${t}</span>`).join("")}</div>`;
        const card = (p, extra = "") => `
            <article class="card">${ph("Gameplay")}
                <div class="cbody">
                    <h3 class="ptitle">${p.name}</h3>
                    <p class="blurb">${p.blurb}</p>${tags(p)}${extra}
                    <a class="go" href="#">View breakdown →</a>
                </div>
            </article>`;

        const LAYOUTS = [
            { id: "alternating", name: "Alternating Rows",
              desc: "Text and media swap sides each row. Closest to your current site — generous, scannable, reads slowly.",
              render: () => PROJECTS.map(p => `
                <div class="row">
                    <div class="rowtext">
                        <h3 class="ptitle">${p.name}</h3>
                        <p class="blurb">${p.blurb}</p>${tags(p)}
                        <a class="go" href="#">Visit project →</a>
                    </div>
                    <div>${ph("Gameplay")}</div>
                </div>`).join("") },

            { id: "cards", name: "Uniform Card Grid",
              desc: "Equal-weight cards in a responsive grid. Fast to scan, easy to extend — drop in a card and it flows.",
              render: () => `<div class="grid">${PROJECTS.map(p => card(p)).join("")}</div>` },

            { id: "mosaic", name: "Staggered Mosaic",
              desc: "Grid with varied tile heights and offsets. More visual rhythm than uniform cards, still auto-flowing.",
              render: () => `<div class="grid">${PROJECTS.map(p => card(p)).join("")}</div>` },

            { id: "feature", name: "Full-Bleed Features",
              desc: "Wide cinematic media with text overlaid on a gradient. Puts your gameplay footage front and centre.",
              render: () => PROJECTS.map(p => `
                <div class="feat">${ph("Gameplay")}
                    <div class="overlay">
                        <h3 class="ptitle">${p.name}</h3>
                        <p class="blurb">${p.blurb}</p>${tags(p)}
                    </div>
                </div>`).join("") },

            { id: "index", name: "Sticky Side Index",
              desc: "Persistent project list on the left, content scrolls on the right. Good once you have many projects.",
              render: () => `
                <div class="split">
                    <nav class="idx">${PROJECTS.map(p => `<a href="#">${p.name}</a>`).join("")}</nav>
                    <div>${PROJECTS.map(p => `
                        <div class="entry">
                            <h3 class="ptitle">${p.name}</h3>
                            <p class="blurb">${p.blurb}</p>${tags(p)}
                            ${ph("Gameplay")}
                        </div>`).join("")}
                    </div>
                </div>` },

            { id: "shelf", name: "Horizontal Shelf",
              desc: "Projects on a swipeable rail with scroll snapping. Compact vertically; works well on touch.",
              render: () => `<div class="shelf">${PROJECTS.map(p => card(p)).join("")}</div>
                <p class="hint">← scroll horizontally →</p>` },

            { id: "list", name: "Compact List",
              desc: "Dense rows with role, year and a small preview. Most information per screen; least visual.",
              render: () => PROJECTS.map(p => `
                <div class="lrow">
                    <div>
                        <h3 class="ptitle">${p.name}</h3>
                        <p class="blurb">${p.blurb}</p>${tags(p)}
                    </div>
                    <div class="lpeek">${ph("")}
                        <div class="lmeta">${p.year} · team of ${p.team}</div>
                    </div>
                </div>`).join("") },

            { id: "splitscreen", name: "Split Screen",
              desc: "Media pinned on one side while the text column scrolls past it. Cinematic, very desktop-forward.",
              render: () => `
                <div class="ss">
                    <div class="ssmedia">${ph("Gameplay")}</div>
                    <div>${PROJECTS.map(p => `
                        <div class="ssentry">
                            <h3 class="ptitle">${p.name}</h3>
                            <p class="blurb">${p.blurb}</p>${tags(p)}
                            <a class="go" href="#">Visit project →</a>
                        </div>`).join("")}
                    </div>
                </div>` },

            { id: "timeline", name: "Timeline",
              desc: "Vertical spine ordered by date. Tells a progression story — good for showing growth over time.",
              render: () => `
                <div class="tl">${PROJECTS.map(p => `
                    <div class="tentry">
                        <div class="tdate">${p.year} · ${p.time}</div>
                        <div class="tgrid">
                            <div>
                                <h3 class="ptitle">${p.name}</h3>
                                <p class="blurb">${p.blurb}</p>${tags(p)}
                            </div>
                            <div>${ph("Gameplay")}</div>
                        </div>
                    </div>`).join("")}
                </div>` },

            { id: "magazine", name: "Magazine Mosaic",
              desc: "One hero project at 2×2 with supporting tiles around it. Signals what you most want seen first.",
              render: () => `<div class="mag">${PROJECTS.map(p => card(p)).join("")}</div>` },

            { id: "proposed", name: "Featured Grid + Indexed List",
              desc: "Top 3 as a uniform card grid, everything else as a compact list with a sticky index beside it.",
              render: () => {
                  const featured = PROJECTS.slice(0, 3);
                  const rest = [...PROJECTS.slice(3), ...FILLER];
                  return `
                    <div class="featgrid">${featured.map(p => card(p)).join("")}</div>
                    <div class="subhead">
                        <h3>More Projects</h3>
                        <p>${rest.length} others — jams, prototypes and tools</p>
                    </div>
                    <div class="split">
                        <nav class="idx">${rest.map(p => `<a href="#${slug(p.name)}">${p.name}</a>`).join("")}</nav>
                        <div class="rows">${rest.map(p => `
                            <div class="lrow" id="${slug(p.name)}">
                                <div>
                                    <h3 class="ptitle">${p.name}</h3>
                                    <p class="blurb">${p.blurb}</p>${tags(p)}
                                </div>
                                <div class="lpeek">${ph("")}
                                    <div class="lmeta">${p.year} · team of ${p.team}</div>
                                </div>
                            </div>`).join("")}
                        </div>
                    </div>`;
              },
              after: () => {
                  const links = [...document.querySelectorAll('[data-layout="proposed"] .idx a')];
                  const rows = [...document.querySelectorAll('[data-layout="proposed"] .lrow')];
                  if (!rows.length) return null;
                  const sync = () => {
                      let i = 0;
                      rows.forEach((r, n) => { if (r.getBoundingClientRect().top <= 120) i = n; });
                      links.forEach((a, n) => a.classList.toggle("active", n === i));
                  };
                  window.addEventListener("scroll", sync, { passive: true });
                  sync();
                  return () => window.removeEventListener("scroll", sync);
              } },
        ];

        const store = {
            get(k) { try { return localStorage.getItem(k); } catch { return null; } },
            set(k, v) { try { localStorage.setItem(k, v); } catch { /* file:// */ } },
        };

        const content = document.getElementById("content");
        const buttons = document.getElementById("buttons");
        const current = document.getElementById("current");
        const layoutName = document.getElementById("layoutName");
        const layoutDesc = document.getElementById("layoutDesc");
        const stage = document.getElementById("stage");

        const num = (i) => String(i + 1).padStart(2, "0");
        let teardown = null;

        LAYOUTS.forEach((l, i) => {
            const b = document.createElement("button");
            b.textContent = num(i);
            b.title = l.name;
            b.dataset.idx = i;
            b.setAttribute("aria-pressed", String(i === 0));
            buttons.appendChild(b);
        });

        function apply(i) {
            const l = LAYOUTS[i];
            if (teardown) { teardown(); teardown = null; }
            content.dataset.layout = l.id;
            content.innerHTML = l.render();
            layoutName.textContent = l.name;
            layoutDesc.textContent = l.desc;
            current.textContent = `${num(i)} — ${l.name}`;
            buttons.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.idx === i)));
            if (l.after) teardown = l.after();
            store.set("kw-layout", i);
        }

        buttons.addEventListener("click", e => {
            const b = e.target.closest("button[data-idx]");
            if (b) apply(+b.dataset.idx);
        });

        document.querySelector(".viewtoggle").addEventListener("click", e => {
            const b = e.target.closest("button[data-view]");
            if (!b) return;
            stage.dataset.view = b.dataset.view;
            document.querySelectorAll(".viewtoggle button").forEach(x =>
                x.setAttribute("aria-pressed", String(x === b)));
        });

        const saved = store.get("kw-layout");
        apply(saved === null ? LAYOUTS.length - 1 : Number(saved));
    </script>
</body>
</html>
